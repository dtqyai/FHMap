<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141b24"><meta name="description" content="极限竞速：地平线 3 本地收集地图。235 个收集点，离线使用，进度自动保存在浏览器。">
<title>Forza Horizon 3 Interactive Map</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<script defer src="data.js"></script><script defer src="maps.js"></script><script defer src="app.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="./" aria-label="Forza Horizon 3 Interactive Map 首页"><span class="brand-mark">H<span>3</span></span><span class="brand-copy"><strong>Forza Horizon 3 Interactive Map</strong></span></a>
</header>
<div class="workspace">
<aside class="sidebar" id="sidebar" aria-label="收集筛选与进度">
  <div class="sidebar-content">
  <div class="sidebar-heading"><button class="icon-button mobile-only" id="close-sidebar" aria-label="关闭筛选">×</button></div>
  <section class="progress-card" aria-label="总收集进度"><div class="progress-label"><span>总收集进度</span><span id="total-percent">0%</span></div><div class="progress-number"><strong id="total-done">0</strong><span>/ 235</span><small>已收集</small></div><div class="progress-track"><i id="total-bar"></i></div><div class="progress-bottom"><span id="remaining">未收集 235 个</span></div></section>
  <div class="section-label"><span>收集状态</span></div>
  <div class="segmented" id="status-filter" role="group" aria-label="收集状态筛选"><button data-status="all" aria-pressed="true">全部</button><button data-status="todo" aria-pressed="false">未收集</button><button data-status="done" aria-pressed="false">已收集</button></div>
  <div class="section-label categories-heading"><span>地图要素</span><button id="toggle-types" class="text-button">全部隐藏</button></div>
  <div id="categories" class="categories"></div>
  </div><div class="sidebar-bottom"><div class="backup-row"><button id="export-button" class="secondary">↗ 导出进度</button><button id="import-button" class="secondary">↙ 导入进度</button></div><div id="save-status" class="save-status" role="status"><i></i> 进度自动保存在此浏览器</div><p class="source-credit">底图：<a href="https://www.spriters-resource.com/xbox_one/forzahorizon3/" target="_blank" rel="noopener noreferrer">The Spriters Resource ↗</a><br>点位：<a href="https://www.kudosprime.com/fh3/gamemap.php" target="_blank" rel="noopener noreferrer">KudosPrime ↗</a></p></div>
</aside>
<button class="sidebar-scrim" id="sidebar-scrim" aria-label="关闭筛选面板" hidden></button>
<main class="main">
  <nav class="region-nav" aria-label="选择地图区域"><div class="region-tabs" id="regions"><button data-region="main" aria-pressed="true"><span>澳洲大陆</span><small>本体</small></button><button data-region="blizzard" aria-pressed="false"><span>暴风雪山</span><small>DLC</small></button><button data-region="hotwheels" aria-pressed="false"><span>风火轮</span><small>DLC</small></button></div><button id="mobile-filters" class="secondary mobile-only">筛选 <span id="mobile-count">183</span></button></nav>
  <section class="map" id="map" tabindex="0" aria-label="收集地图，可拖动和缩放。点击标记切换收集状态。">
    <div id="map-layers"></div>
    <div id="markers"></div>
    <div class="map-heading"><p><span id="visible-count">183</span> 个要素显示中 <span class="dot-separator">·</span> <span id="region-progress">0 / 183 已收集</span></p></div>
    <div class="compass" aria-hidden="true"><span>N</span><svg viewBox="0 0 32 32"><path d="m16 3 7 23-7-4-7 4Z" fill="#e9eeee"/><path d="m16 3 0 19-7 4Z" fill="#f34599"/></svg></div>
    <div class="map-tools" aria-label="地图工具"><button id="zoom-in" aria-label="放大地图" title="放大 (+)">+</button><output id="zoom-level" aria-label="缩放比例">100%</output><button id="zoom-out" aria-label="缩小地图" title="缩小 (-)">−</button><span></span><button id="fit-map" aria-label="显示整个当前区域" title="适应地图 (0)"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M8 12h8m-4-4v8"/></svg></button><button id="dim-map" aria-label="降低底图亮度" aria-pressed="false" title="降低底图亮度"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button></div>
    <div class="map-bottom"><span><i class="live-dot"></i> <span id="map-status">本地地图 · 无需登录</span></span><span class="map-gesture">拖动平移 <span>·</span> 滚轮缩放 <span>·</span> 点击标记收集</span></div>
  </section>
</main>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button id="undo-button" hidden>撤销</button><button id="close-toast" aria-label="关闭提示">×</button></div>
<dialog id="backup-dialog"><div class="dialog-heading"><h2 id="backup-title">导出收集进度</h2><button id="close-backup" class="icon-button" aria-label="关闭备份窗口">×</button></div><p id="backup-intro"></p><div id="import-file-row" hidden><label class="file-label">选择 JSON 文件<input id="import-file" type="file" accept=".json,application/json"></label><span>或在下方粘贴备份内容</span></div><label class="field-label" for="backup-content">进度备份 JSON</label><textarea id="backup-content" spellcheck="false"></textarea><label class="replace-option" id="replace-row" hidden><input type="checkbox" id="replace-progress">替换当前进度（默认仅合并，不取消已有标记）</label><p id="backup-error" class="error" role="alert" hidden></p><div class="dialog-actions"><button id="cancel-backup" class="secondary">取消</button><button id="backup-submit" class="primary">下载 JSON 备份</button></div></dialog>
<noscript><div class="noscript">请启用 JavaScript 以使用地图和收集标记。</div></noscript>
</body></html>
